name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Setup bnd
        uses: carabiner-dev/actions/install/bnd@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install tejolote
        uses: kubernetes-sigs/release-actions/setup-tejolote@b5b8280a60e6e20607f77068011269b982c60971 # v0.4.5

      - name: Set tag output
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Provenance
        id: tejolote
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            tejolote attest --artifacts github://${{github.repository}}/${{ steps.tag.outputs.tag_name }} github://${{github.repository}}/"${GITHUB_RUN_ID}" --output provenance.json
            bnd statement provenance.json -o provenance.bundle.json
            # Open the release attestations file: JSONL, one sigstore bundle
            # per line. bnd writes the bundle as single-line JSON without a
            # trailing newline; the perl pass flattens defensively and
            # terminates the record.
            perl -0777 -pe 's/\s*\n\s*//g; $_ .= "\n"' provenance.bundle.json > attestations.intoto.jsonl

      - name: Generate SBOM
        id: sbom
        uses: carabiner-dev/actions/sbom/source@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0
        with:
          sign: "true"
          output-path: /tmp

      - name: Upload attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_FILES: ${{ steps.sbom.outputs.files }}
        run: |
          # Append the signed SBOM bundles to the attestations file and
          # publish the whole set: one sigstore bundle per line.
          for f in ${SBOM_FILES}; do
            perl -0777 -pe 's/\s*\n\s*//g; $_ .= "\n"' "$f" >> attestations.intoto.jsonl
          done
          gh release upload ${{ steps.tag.outputs.tag_name }} attestations.intoto.jsonl
          bnd push ${{github.repository}} attestations.intoto.jsonl
